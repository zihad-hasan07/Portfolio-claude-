# Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL is a public project URL (not a secret) and must be embedded
  # directly in index.html since this is a plain static site with no
  # build-time env injection. Exclude it from secrets scanning so the build
  # doesn't fail on its own public config value.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Inject Supabase env vars into the client at build time is NOT supported
# for plain static HTML. Instead, the anon key is embedded directly in
# index.html (safe with RLS). For the bootstrap-admin function, set these
# as Netlify env vars in the dashboard (Site settings → Environment variables):
#   SUPABASE_URL           — project URL (public, safe to expose)
#   SUPABASE_SERVICE_ROLE  — service_role key, server-only, NEVER commit this
