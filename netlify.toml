# Netlify configuration
[build]
  command = "node scripts/generate-config.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL is a public project URL (not a secret) — it's written into
  # config.js at build time from the SUPABASE_URL env var (never committed
  # to the repo) and is safe to expose in the browser. Exclude it from
  # secrets scanning so the build doesn't fail on its own public config value.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Set these as Netlify env vars in the dashboard (Site settings →
# Environment variables):
#   SUPABASE_URL           — project URL (public, safe to expose; injected
#                             into config.js at build time, see above)
#   SUPABASE_SERVICE_ROLE  — service_role key, server-only, NEVER commit this,
#                             only ever read via Netlify.env.get() in functions
